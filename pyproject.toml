[project]
name = "blueprint-pudim-code-reviewer"
version = "1.0.2"
description = "A GitHub Action that reviews PR diffs using a swappable LLM backend (Anthropic, OpenAI, Gemini) via LangGraph"
authors = [
    { name = "Luis Machado Reis", email = "contact@luismachadoreis.dev" }
]
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    ".venv/*",
    "tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]
