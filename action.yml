name: "Blueprint Pudim Code Reviewer"
description: "Reviews pull request diffs using a swappable LLM backend (Anthropic, OpenAI, or Gemini) via LangGraph"
author: "Luis Machado Reis (luismr)"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  provider:
    description: "Model provider to use: anthropic | openai | google_genai"
    required: true
    default: "anthropic"
  model:
    description: "Model name, e.g. claude-sonnet-4-6, gpt-4.1, gemini-2.5-pro"
    required: true
  api_key:
    description: "API key for the selected provider"
    required: true
  github_token:
    description: "Token used to read the PR diff and post the review comment"
    required: true
    default: ${{ github.token }}
  additional_rules:
    description: "Optional extra code review rules appended to the built-in prompt"
    required: false
    default: ""
  additional_rules_file:
    description: "Optional path to a rules file in the consumer repo (e.g. .github/pudim-review-rules.md). Requires checkout. Appended before additional_rules."
    required: false
    default: ""
  trigger_label:
    description: "PR label that triggered this review (e.g. pudim-code-review). When set, the action can remove it after the review."
    required: false
    default: ""
  remove_trigger_label:
    description: "When to remove trigger_label: changes_requested (default) | always | never"
    required: false
    default: "changes_requested"
  auto_approve:
    description: "When true, submit APPROVE verdicts as GitHub PR approvals. When false (default), APPROVE verdicts are posted as COMMENT reviews only."
    required: false
    default: "false"

outputs:
  review:
    description: "The full text of the posted review"
  commit_sha:
    description: "Head commit SHA used to post inline review comments"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run review
      shell: bash
      run: python ${{ github.action_path }}/review.py
      env:
        MODEL_PROVIDER: ${{ inputs.provider }}
        MODEL_NAME: ${{ inputs.model }}
        API_KEY: ${{ inputs.api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ADDITIONAL_RULES: ${{ inputs.additional_rules }}
        ADDITIONAL_RULES_FILE: ${{ inputs.additional_rules_file }}
        TRIGGER_LABEL: ${{ inputs.trigger_label }}
        REMOVE_TRIGGER_LABEL: ${{ inputs.remove_trigger_label }}
        AUTO_APPROVE: ${{ inputs.auto_approve }}
