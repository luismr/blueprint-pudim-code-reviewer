# Dogfood workflow: add the "pudim-code-review" label to a PR to trigger a review.
# auto_approve: true — APPROVE verdicts submit a GitHub approval.
# GITHUB_TOKEN cannot approve PRs in Actions; the action falls back to a
# comment-only review automatically. For real approvals, use a PAT:
#   github_token: ${{ secrets.PUDIM_GITHUB_PAT }}
#
# Requires repository secret: ANTHROPIC_API_KEY
# Consumer template: examples/pudim-code-review-labeled.yml
name: Pudim Code Review (labeled)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.label.name == 'pudim-code-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          provider: anthropic
          # Use sonnet for nuanced, high-quality code reviews.
          # Haiku is faster and cheaper but less suitable for complex review guidance.
          model: claude-sonnet-4-6
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto_approve: true
          trigger_label: pudim-code-review
          remove_trigger_label: changes_requested
