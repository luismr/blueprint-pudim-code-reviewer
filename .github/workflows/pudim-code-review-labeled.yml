# Dogfood workflow for blueprint-pudim-code-reviewer.
#
# How to trigger:
#   1. Open a pull request
#   2. Add the "pudim-code-review" label
#   3. The action runs and posts a structured review (overview + inline comments)
#
# auto_approve is ENABLED for this repo's reviews — when the model verdict is
# APPROVE, the action attempts to submit a real GitHub PR approval (not just a
# comment). This is intentional dogfooding of the auto-approve feature.
#
# GITHUB_TOKEN limitation:
#   GitHub Actions blocks the default GITHUB_TOKEN from approving PRs. The action
#   detects that 422 error and falls back to a comment-only review automatically
#   (the job still succeeds). To get real approvals in this repo, add a PAT secret
#   and replace github_token below:
#     github_token: ${{ secrets.PUDIM_GITHUB_PAT }}
#
# Re-review loop:
#   After CHANGES_REQUESTED, the label is removed automatically. Fix the code,
#   then re-add "pudim-code-review" when you want another pass. Prior reviews
#   from this action are included in context so follow-up reviews reference
#   earlier feedback.
#
# Requires repository secret: ANTHROPIC_API_KEY
# Consumer template: examples/pudim-code-review-labeled.yml
name: Pudim Code Review (labeled)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.label.name == 'pudim-code-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          provider: anthropic
          # Sonnet: best quality for code review (default in this repo).
          # Haiku: faster/cheaper — swap to claude-haiku-4-5 for quick feedback.
          model: claude-sonnet-4-6
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Enabled for this repo — see header comment for GITHUB_TOKEN vs PAT.
          auto_approve: true
          trigger_label: pudim-code-review
          remove_trigger_label: changes_requested
