# Add the "pudim-code-review" label to a PR to trigger a review.
# auto_approve is true — APPROVE verdicts are posted as GitHub approvals.
#
# Requires repository secret: ANTHROPIC_API_KEY
name: Pudim Code Review (labeled)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.label.name == 'pudim-code-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          provider: anthropic
          model: claude-haiku-4-5
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto_approve: true
          trigger_label: pudim-code-review
          remove_trigger_label: changes_requested
