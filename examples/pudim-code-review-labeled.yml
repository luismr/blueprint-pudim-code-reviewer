# Consumer template: copy to .github/workflows/pudim-code-review-labeled.yml
# in your repo, then add the "pudim-code-review" label to a PR to trigger a review.
#
# auto_approve is false — APPROVE verdicts are posted as comment-only reviews.
# GITHUB_TOKEN cannot approve PRs in Actions; use a PAT for real approvals.
#
# Requires repository secret: ANTHROPIC_API_KEY
# This repo dogfoods the action from .github/workflows/pudim-code-review-labeled.yml
# (uses: ./). Consumer repos should use the published action below.
name: Pudim Code Review (labeled)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.label.name == 'pudim-code-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: luismr/blueprint-pudim-code-reviewer@v1
        with:
          provider: anthropic
          # Use sonnet for nuanced, high-quality code reviews.
          # Haiku is faster and cheaper but less suitable for complex review guidance.
          model: claude-sonnet-4-6
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto_approve: false
          trigger_label: pudim-code-review
          remove_trigger_label: changes_requested
